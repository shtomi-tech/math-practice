<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学演習・印刷</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="./static/rikaido2507-data.js"></script>
  <script defer src="./static/rikaido2608-data.js?v=20260829-rikaido2608-high1"></script>
  <script defer src="./static/rikaido2507-solutions.js"></script>
  <script defer src="./static/rikaido2608-solutions.js?v=20260829-rikaido2608-high1"></script>
  <script defer src="./static/kawai-data.js?v=20260829-kawai-zenkijutsu2-typeI-II"></script>
  <script defer src="./static/kawai-solutions.js?v=20260829-kawai-zenkijutsu2-typeI-II"></script>
  <script defer src="./static/tanmon-data.js?v=20260821-two-group-combinations"></script>
  <script defer src="./static/tanmon-solutions.js?v=20260821-two-group-combinations"></script>
  <style>
    :root {
      --ink: #21242e;
      --line: #3d4f97;
      --paper: #fff;
      --ice: #c0d5e6;
      --canvas: #7a8aba;
      --muted: #4d5487;
      --serif: "Arial Black", Arial, "Yu Gothic", sans-serif;
      --sans: Arial, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html { background: var(--canvas); }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: var(--sans);
      line-height: 1.7;
    }

    h1,
    h2,
    h3,
    h4,
    p { margin: 0; }

    .print-page {
      width: min(760px, calc(100% - 32px));
      margin: 32px auto 64px;
    }

    .print-intro {
      margin-bottom: 20px;
      padding: 16px 18px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: 0 3px 0 var(--line);
    }

    .print-intro .eyebrow,
    .group-eyebrow,
    .section-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .print-intro h1 {
      margin-top: 4px;
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1.35;
    }

    .print-group {
      padding: 24px;
      border: 1px solid var(--ink);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 3px 0 var(--line);
    }

    .print-group + .print-group {
      margin-top: 28px;
      break-before: page;
      page-break-before: always;
    }

    .group-header {
      border-bottom: 2px solid var(--ink);
      padding-bottom: 12px;
    }

    .group-header h2 {
      margin-top: 4px;
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.45;
    }

    .group-stem {
      margin-top: 16px;
      padding: 12px;
      border-left: 3px solid var(--line);
      background: var(--ice);
    }

    .print-subproblem {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f7fbff;
      box-shadow: 0 2px 0 rgba(61, 79, 151, .35);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .sub-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--ice);
    }

    .sub-header h3 {
      font-family: var(--serif);
      font-size: 18px;
    }

    .print-section {
      padding: 14px;
    }

    .print-section + .print-section {
      border-top: 1px solid var(--line);
    }

    .section-label {
      margin-bottom: 6px;
      color: var(--ink);
      font-weight: 700;
    }

    .section-body > :first-child { margin-top: 0; }
    .section-body > :last-child { margin-bottom: 0; }
    .section-body p + p { margin-top: 8px; }

    .formula {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .formula h4 {
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .06em;
    }

    .answer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .solution-figure {
      margin: 14px auto 0;
      color: var(--ink);
      text-align: center;
    }

    .solution-figure-svg {
      display: block;
      width: min(100%, 380px);
      height: auto;
      margin: 0 auto;
    }

    .katex-display {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
    }

    @media print {
      @page {
        size: A4;
        margin: 16mm;
      }

      html,
      body {
        background: #fff;
        color: #000;
      }

      .print-page {
        width: auto;
        margin: 0;
      }

      body {
        font-size: 10.5px;
        line-height: 1.4;
      }

      .print-intro {
        display: none;
      }

      .print-intro .eyebrow,
      .group-eyebrow,
      .section-label {
        color: #000;
      }

      .print-group,
      .print-group + .print-group {
        margin-top: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: #fff;
        box-shadow: none;
      }

      .print-group + .print-group {
        break-before: page;
        page-break-before: always;
      }

      .group-header {
        border-color: #000;
        padding-bottom: 3mm;
      }

      .group-header h2 {
        font-size: 16px;
      }

      .group-stem,
      .sub-header,
      .formula {
        background: #fff;
      }

      .group-stem {
        margin-top: 2.5mm;
        padding: 2.5mm;
        border-left-color: #000;
      }

      .print-subproblem {
        margin-top: 3mm;
        border-color: #000;
        border-radius: 0;
        background: #fff;
        box-shadow: none;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      .sub-header {
        padding: 1.5mm 2.5mm;
      }

      .sub-header h3 {
        font-size: 14px;
      }

      .print-section {
        padding: 2.5mm;
      }

      .formula {
        margin-top: 1.5mm;
        padding: 1.5mm;
      }

      .answer {
        margin-top: 1.5mm;
        padding-top: 1.5mm;
      }

      .solution-figure-svg {
        width: min(100%, 240px);
      }

      .print-subproblem-tall {
        font-size: 9px;
        line-height: 1.3;
      }

      .print-subproblem-tall .print-section {
        padding: 2mm;
      }

      .print-subproblem-tall .katex-display {
        margin: .15em 0;
      }

      .print-subproblem-tall .solution-figure-svg {
        width: min(100%, 180px);
      }

      .sub-header,
      .print-section + .print-section,
      .formula,
      .answer {
        border-color: #000;
      }

      .solution-figure,
      .solution-figure-svg {
        color: #000;
      }

      .katex-display {
        margin: .35em 0;
        overflow: visible;
      }
    }
  </style>
</head>
<body>
  <main id="printContent" class="print-page" aria-live="polite">
    <header class="print-intro">
      <p class="eyebrow">MATH / SOLUTIONS</p>
      <h1>数学演習・印刷</h1>
    </header>
  </main>

  <script>
    const escapeHtml = (text = "") => String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    function mdLite(text = "") {
      return escapeHtml(text)
        .split(/\n{2,}/)
        .map((paragraph) => `<p>${paragraph.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    function solutionTextHtml(text = "") {
      const normalized = String(text).replace(/\$\$([\s\S]*?)\$\$/g, (_, body) =>
        `$$${body.replace(/\r?\n/g, " ")}$$`,
      );
      return mdLite(normalized);
    }

    function renderMath(root = document.body) {
      if (!window.renderMathInElement) return;
      window.renderMathInElement(root, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true },
        ],
        macros: { "\\bun": "\\dfrac{#1}{#2}" },
        throwOnError: false,
      });
    }

    function solutionFormulaHtml(formula) {
      if (!formula) return "";
      return `
        <div class="formula">
          <h4>${escapeHtml(formula.title || "公式")}</h4>
          <div>${solutionTextHtml(formula.body || "")}</div>
        </div>
      `;
    }

    function questionFigureHtml(sub) {
      return sub.figure
        ? `<div class="solution-figure question-figure">${sub.figure}</div>`
        : "";
    }

    function sectionHtml(label, body) {
      return `
        <section class="print-section">
          <h4 class="section-label">${label}</h4>
          <div class="section-body">${body}</div>
        </section>
      `;
    }

    function renderSubproblem(group, sub, solutions) {
      const solution = solutions?.[`${group.group_number}-${sub.label}`];
      if (!solution) return "";
      const question = `${mdLite(sub.stem_md || "")}${questionFigureHtml(sub)}`;
      const approach = `${solutionTextHtml(solution.approach || "")}${solutionFormulaHtml(solution.formula)}`;
      const answer = `
        ${solutionTextHtml(solution.solution || "")}
        ${solution.figure ? `<div class="solution-figure">${solution.figure}</div>` : ""}
        <p class="answer"><strong>答え：</strong>${solutionTextHtml(solution.answer || "")}</p>
      `;
      const compactClass = (group.group_number === "4" && sub.label === "(3)") || group.group_number === "8"
        ? " print-subproblem-tall"
        : "";
      return `
        <article class="print-subproblem${compactClass}">
          <header class="sub-header"><h3>${escapeHtml(sub.label)}</h3></header>
          ${sectionHtml("問題", question)}
          ${sectionHtml("方針", approach)}
          ${sectionHtml("解答", answer)}
        </article>
      `;
    }

    function renderPrintPage() {
      const params = new URLSearchParams(window.location.search);
      const examKey = params.get("exam") || "rikaido_2507_beta";
      const groupKey = params.get("group");
      const dataset = window.MATH_DATASETS?.[examKey];
      const solutions = window.MATH_SOLUTIONS?.[examKey];
      const content = document.querySelector("#printContent");

      if (!dataset || !solutions) {
        content.insertAdjacentHTML("beforeend", "<p>この試験の印刷データはありません。</p>");
        return;
      }

      const allGroups = dataset.problem_groups || [];
      const groups = groupKey
        ? allGroups.filter((group) => String(group.group_number) === groupKey)
        : allGroups;
      if (!groups.length) {
        content.insertAdjacentHTML("beforeend", "<p>指定された大問の印刷データはありません。</p>");
        return;
      }

      const source = groups[0];
      document.title = `${source.source_name || "数学演習"} ${source.source_year || ""} 印刷`;
      content.insertAdjacentHTML("beforeend", groups.map((group) => `
        <section class="print-group">
          <header class="group-header">
            <p class="group-eyebrow">GROUP ${escapeHtml(group.group_number)}</p>
            <h2>${escapeHtml(group.title || "")}</h2>
          </header>
          <div class="group-stem">${mdLite(group.stem_md || "")}</div>
          ${(group.sub_problems || []).map((sub) => renderSubproblem(group, sub, solutions)).join("")}
        </section>
      `).join(""));
      renderMath(content);
    }

    document.addEventListener("DOMContentLoaded", renderPrintPage);
  </script>
</body>
</html>
